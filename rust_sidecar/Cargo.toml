[package]
name = "converter-rust-sidecar"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
pulldown-cmark = "0.10"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "hot_paths"
harness = false
